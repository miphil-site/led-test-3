name: LED
options:
  bundleIdPrefix: com.saitama.led
  deploymentTarget:
    iOS: "15.0"

targets:
  LED:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saitama.led
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "Diese App steuert deine Govee LED-Strips per Bluetooth."
        NSBluetoothPeripheralUsageDescription: "Diese App steuert deine Govee LED-Strips per Bluetooth."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
